name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # rodio/cpal link against ALSA on Linux.
      - name: Install ALSA development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked --all-targets

      # Keep public builds free of both rustc and Clippy warnings.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings -D clippy::all

      - name: Smoke test both commands
        run: |
          cargo run --locked --bin pk -- --version
          cargo run --locked --bin peak-fm -- --version

      - name: Verify syntax and theme notices
        if: runner.os == 'Linux'
        run: |
          echo "497436e882381943c576a003ffd62cf0221fc9d1f52cd7372be1ffd47a047f7c  src/core/noclownfiesta.tmTheme" | sha256sum --check
          cargo run --locked --example generate_third_party_licenses
          git diff --exit-code -- SYNTAX_THEME_LICENSES.md

      - name: Verify release package
        if: runner.os == 'Linux'
        run: cargo package --locked
