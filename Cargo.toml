[package]
name = "peak-fm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
autobins = false
default-run = "pk"
description = "A fast, vim-like terminal file manager built around Miller columns"
readme = "README.md"
documentation = "https://docs.rs/peak-fm"
license-file = "LICENSE"
keywords = ["file-manager", "terminal", "tui", "vim"]
categories = ["command-line-utilities", "filesystem"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE*",
    "/SYNTAX_THEME_LICENSES.md",
    "/examples/generate_third_party_licenses.rs",
]

[[bin]]
name = "pk"
path = "src/main.rs"

[[bin]]
name = "peak-fm"
path = "src/bin/peak-fm.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
syntect = { version = "=5.3.0", default-features = false, features = ["default-themes", "regex-onig", "plist-load"] }
two-face = "=0.4.5"
nucleo = "0.5"
ignore = "0.4"
once_cell = "1.19"
serde_json = "=1.0.140"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
dirs = "5.0"
rodio = "0.19"
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.21"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
blake3 = "1.5"
bincode = "1.3"
regex = "1"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
devicons = "0.6"
base64 = "0.22"
libc = "0.2"
fs2 = "0.4"
rand = "0.8"
realfft = "3.3"
num-complex = "0.4"
parking_lot = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_Security",
]

[dev-dependencies]
tempfile = "3.10"
